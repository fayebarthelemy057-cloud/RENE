<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Academy</title>
<meta name="description" content="Digital Academy : apprendre l’ordinateur, la bureautique, Internet, la création web, la sécurité et l’IA, gratuitement et à son rythme.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>try{var th=localStorage.getItem("sylvie-theme");if(th)document.documentElement.dataset.skin=th;}catch(e){}</script>
<style>
/* =========================================================
   DESIGN — tout se règle ici.
   Pour changer les couleurs ou les polices, modifie les
   variables d'un thème ci-dessous. Trois thèmes existent :
   « teranga » (par défaut), « ludique » (l'ancien design)
   et « sombre ». Le bouton 🎨 en haut de la page les alterne.
   ========================================================= */
:root{
  /* Digital Academy : bleu profond, bleu moyen, turquoise, fond clair (document de cadrage) */
  --f-body:"Lexend",system-ui,sans-serif;
  --f-head:"Bricolage Grotesque","Lexend",system-ui,sans-serif;
  --bg:#F5F7FA; --bg-img:none;
  --surface:#FFFFFF; --surface2:#EEF2F7; --line:#D8E0EA;
  --ink:#12345A; --soft:#50657F; --head:#12345A;
  --accent:#168C83; --accent-ink:#FFFFFF; --accent-d:#0F655E; --hl:#BFE6E2;
  --link:#245B8F;
  --ok:#1E8A5A; --ok-d:#146441; --ok-bg:#E3F4EA; --ok-line:#A9DCBF;
  --bad:#C2413B; --bad-bg:#FBE9EA;
  --info-bg:#E6EEF8; --warn-bg:#FFF5D6; --warn-ink:#7A5600;
  --code-bg:#0F2238; --code-ink:#E6EEF7;
  --r:14px; --r-lg:22px; --depth:3px;
  --shadow:0 1px 0 rgba(18,52,90,.06),0 12px 28px -18px rgba(18,52,90,.35);
  --card-bd:1px solid var(--line);
  --top-bg:rgba(245,247,250,.92);
  --frame:#12345A;
  --navy:var(--head); --green:var(--ok); --red:var(--bad); --teal:var(--link); --orange:var(--accent-d); --sun:var(--accent); --purple:#6A4FB6; --card:var(--surface);
  color-scheme:light;
}
:root[data-skin="ludique"]{
  --f-body:Nunito,system-ui,sans-serif; --f-head:"Baloo 2",Nunito,sans-serif;
  --bg:#FFF7E8; --bg-img:radial-gradient(circle at 10% 0%,#ffe7b8 0,transparent 35%),radial-gradient(circle at 100% 30%,#d8f1f8 0,transparent 30%);
  --surface:#fff; --surface2:#fbf7ef; --line:#eadfcb;
  --ink:#1d2a3a; --soft:#5b6b7d; --head:#023047;
  --accent:#FB8500; --accent-ink:#fff; --accent-d:#c96a00; --link:#1C9CC0;
  --ok:#0FA37F; --ok-d:#0a7058; --ok-bg:#e6f8f1; --ok-line:#9fe3c9;
  --bad:#E5484D; --bad-bg:#fdecec; --info-bg:#eef8fc; --warn-bg:#fff3d6; --warn-ink:#a35d00;
  --r:20px; --r-lg:28px; --depth:4px;
  --shadow:0 6px 0 rgba(2,48,71,.10),0 10px 30px rgba(2,48,71,.08);
  --card-bd:2px solid #f3ead9; --top-bg:rgba(255,247,232,.92); --frame:#023047;
  --m1:#1C9CC0; --m2:#FB8500; --m3:#0FA37F; --m4:#7B61FF;
}
:root[data-skin="sombre"]{
  --bg:#0B1A2E; --surface:#12263F; --surface2:#183152; --line:#24426A;
  --ink:#E6EEF7; --soft:#9FB3CC; --head:#FFFFFF;
  --accent:#2BB3A8; --accent-ink:#06221F; --accent-d:#1B8077; --hl:#1B5A55; --link:#8EC0F5;
  --ok:#3CC487; --ok-d:#23905F; --ok-bg:#133A33; --ok-line:#2C7457;
  --bad:#FF7A72; --bad-bg:#3D1C24; --info-bg:#173459; --warn-bg:#3A3015; --warn-ink:#F6D77A;
  --code-bg:#06111F; --code-ink:#E6EEF7;
  --shadow:0 12px 28px -16px rgba(0,0,0,.6); --top-bg:rgba(11,26,46,.92); --frame:#06111F;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-skin]){
  --bg:#0B1A2E; --surface:#12263F; --surface2:#183152; --line:#24426A;
  --ink:#E6EEF7; --soft:#9FB3CC; --head:#FFFFFF;
  --accent:#2BB3A8; --accent-ink:#06221F; --accent-d:#1B8077; --hl:#1B5A55; --link:#8EC0F5;
  --ok:#3CC487; --ok-d:#23905F; --ok-bg:#133A33; --ok-line:#2C7457;
  --bad:#FF7A72; --bad-bg:#3D1C24; --info-bg:#173459; --warn-bg:#3A3015; --warn-ink:#F6D77A;
  --code-bg:#06111F; --code-ink:#E6EEF7;
  --shadow:0 12px 28px -16px rgba(0,0,0,.6); --top-bg:rgba(11,26,46,.92); --frame:#06111F;
  color-scheme:dark;
}}
:root[data-theme="dark"]:not([data-skin]){
  --bg:#0B1A2E; --surface:#12263F; --surface2:#183152; --line:#24426A;
  --ink:#E6EEF7; --soft:#9FB3CC; --head:#FFFFFF;
  --accent:#2BB3A8; --accent-ink:#06221F; --accent-d:#1B8077; --hl:#1B5A55; --link:#8EC0F5;
  --ok:#3CC487; --ok-d:#23905F; --ok-bg:#133A33; --ok-line:#2C7457;
  --bad:#FF7A72; --bad-bg:#3D1C24; --info-bg:#173459; --warn-bg:#3A3015; --warn-ink:#F6D77A;
  --code-bg:#06111F; --code-ink:#E6EEF7;
  --shadow:0 12px 28px -16px rgba(0,0,0,.6); --top-bg:rgba(11,26,46,.92); --frame:#06111F;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);background:var(--bg);background-image:var(--bg-img);color:var(--ink);font-size:17px;line-height:1.6}
h1,h2,h3,.baloo{font-family:var(--f-head);line-height:1.15;margin:0;color:var(--head);letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
kbd{display:inline-block;min-width:1.8em;padding:1px 8px;border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;background:var(--surface);font-family:var(--f-body);font-weight:600;font-size:.85em;color:var(--ink);white-space:nowrap;text-align:center}
a{color:var(--link)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--top-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:block}
.toprow{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:800;font-size:22px;color:var(--head);text-decoration:none}
.brand svg{width:38px;height:38px}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px}
.lvlbar{width:90px;height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.lvlbar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .6s}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px}
@media (max-width:640px){.pill.hide-s{display:none}.brand span{display:none}.themebtn span{display:none}}

/* Éléments communs */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:var(--card-bd)}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);box-shadow:0 var(--depth) 0 var(--accent-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
.btn.teal{background:var(--head);color:var(--surface);box-shadow:0 var(--depth) 0 rgba(0,0,0,.3)}
.btn.green{background:var(--ok);color:#fff;box-shadow:0 var(--depth) 0 var(--ok-d)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 var(--depth) 0 var(--line)}
.btn.small{padding:7px 14px;font-size:15px;border-radius:10px}
.muted{color:var(--soft)}
section{padding:26px 0}
.hidden{display:none!important}

/* Accueil */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:34px 0 10px}
.mascot{width:150px;height:150px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.bubble{position:relative;background:var(--surface);border:var(--card-bd);border-radius:var(--r-lg);padding:20px 24px;box-shadow:var(--shadow);font-size:18px}
.bubble:before{content:"";position:absolute;left:-12px;top:44px;border:12px solid transparent;border-right-color:var(--surface);border-left:0}
.hero h1{font-size:clamp(30px,4.6vw,48px);font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--hl) 62%)}
@media (max-width:640px){.hero{grid-template-columns:1fr;text-align:center}.mascot{margin:auto;width:120px;height:120px}.bubble:before{display:none}}
.namebox{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.namebox input{flex:1;min-width:180px;font:inherit;font-weight:600;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.namebox input:focus{border-color:var(--link)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.how div{background:var(--surface);border-radius:var(--r);padding:14px;border:1px dashed var(--line);text-align:center;font-weight:600}
.how b{display:block;font-size:30px}
@media (max-width:640px){.how{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:16px;text-align:center}
.stat b{display:block;font-family:var(--f-head);font-size:34px;color:var(--head);line-height:1}
.stat span{font-weight:600;color:var(--soft);font-size:14px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:760px){.modules{grid-template-columns:1fr}}
.mod{padding:22px 22px 20px;cursor:pointer;position:relative;overflow:hidden;text-align:left;width:100%;font:inherit;color:inherit;border-top:6px solid var(--mc)!important;transition:transform .15s}
.mod:hover{transform:translateY(-2px)}
.mod .ico{font-size:40px;width:68px;height:68px;border-radius:18px;display:grid;place-items:center;margin-bottom:10px}
.mod h3{font-size:23px}
.mod .num{position:absolute;right:18px;top:6px;font-family:var(--f-head);font-weight:800;font-size:72px;color:var(--mc);opacity:.16}
.prog{height:10px;background:var(--surface2);border-radius:10px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;border-radius:10px;transition:width .6s}
.badges{display:flex;flex-wrap:wrap;gap:12px}
.badge{width:118px;text-align:center;padding:12px 8px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;line-height:1.25}
.badge b{display:block;font-size:36px;line-height:1.2;margin-bottom:4px}
.badge.off{filter:grayscale(1);opacity:.4}
.sec-title{font-size:28px;font-weight:800}

/* Page module */
.modhead{border-radius:var(--r-lg);padding:26px;color:#fff;display:flex;gap:20px;align-items:center;margin-top:22px}
.modhead h1{font-size:clamp(26px,4vw,40px);color:#fff}
.modhead .big{font-size:64px}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--surface);padding:6px 14px;border-radius:999px;border:1px solid var(--line)}
.path{display:flex;flex-direction:column;gap:12px;padding:20px 0}
.node{display:flex;align-items:center;gap:16px;padding:14px 18px;text-decoration:none;color:inherit;transition:transform .15s}
:root[data-skin="ludique"] .node{width:min(560px,100%)}
:root[data-skin="ludique"] .node:nth-child(even){align-self:flex-end}
.node:hover{transform:translateX(3px)}
.node .dot{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.node h3{font-size:20px}
.node .st{font-size:18px;letter-spacing:2px}
.node.next{outline:3px solid var(--accent);outline-offset:3px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:middle}

/* Page mission */
.mhead{display:flex;gap:18px;align-items:center;margin-top:16px}
.mhead .big{font-size:52px;width:88px;height:88px;border-radius:22px;display:grid;place-items:center;flex:none}
.mhead h1{font-size:clamp(26px,4vw,38px);font-weight:800}
.goal{margin-top:16px;padding:14px 18px;border-radius:var(--r);background:var(--surface);border-left:8px solid var(--accent);font-weight:600}
.part{margin-top:24px;padding:22px}
.part h2{font-size:24px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.part h2 .n{background:var(--head);color:var(--surface);border-radius:10px;padding:0 10px;font-size:18px}

/* Étapes avec image */
.steps{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.steps li{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start;padding:16px;border-radius:var(--r);background:var(--surface2);border:2px solid transparent;transition:background .2s,border-color .2s}
.steps li.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.steps .head{display:flex;gap:12px;align-items:flex-start}
.steps .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:16px;font-family:var(--f-head)}
.steps li.ok .num{background:var(--ok);color:#fff}
.steps .txt{flex:1;min-width:0;padding-top:4px}
.stepbtns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0 46px}
.steps .say{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--link)}
.steps .chk{margin:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--soft)}
.steps li.ok .chk{background:var(--ok);color:#fff;border-color:var(--ok)}
@media (max-width:820px){.steps li{grid-template-columns:1fr}}
.shot{margin:0;position:relative;border-radius:12px;background:var(--frame);padding:7px 7px 18px;cursor:zoom-in;box-shadow:0 10px 24px -14px rgba(0,0,0,.5)}
.shot:after{content:"";position:absolute;left:50%;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#ffffff40}
.shot svg,.shot img{display:block;width:100%;height:auto;border-radius:5px;background:#fff}
.shot img{display:none}
.shot.has-real img{display:block}
.shot.has-real svg{display:none}
.shot .zoom{position:absolute;right:12px;top:12px;background:rgba(27,37,89,.82);color:#fff;border-radius:8px;font-size:12px;font-weight:600;padding:2px 8px;opacity:0;transition:opacity .2s}
.shot:hover .zoom,.shot:focus-visible .zoom{opacity:1}
.il-mk{animation:mk 1.6s ease-in-out infinite}
@keyframes mk{50%{opacity:.35}}
.lightbox{position:fixed;inset:0;z-index:180;background:rgba(10,14,35,.82);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox .shot{width:min(1100px,100%);cursor:zoom-out}
.lightbox p{color:#fff;max-width:1100px;margin:12px auto 0;font-weight:600}

.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.notes label{font-weight:700;font-size:14px;color:var(--soft)}
.notes input{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
@media (max-width:640px){.notes{grid-template-columns:1fr}}
.donebar{margin-top:24px;padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.bigstars{font-size:46px;letter-spacing:6px}
.bigstars .e{filter:grayscale(1);opacity:.25}

/* Activités */
.act{margin-top:12px}
.actbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-weight:700}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}
.dots i.cur{background:var(--accent)}
.errs{color:var(--bad)}
.sortcard{margin:10px auto 18px;max-width:480px;padding:26px;text-align:center;font-size:22px;font-weight:700;border-radius:var(--r-lg);background:var(--surface);border:2px solid var(--head);box-shadow:0 5px 0 var(--head)}
.sortcard .em{font-size:48px;display:block}
.cats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cat{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--line);transition:.1s}
.cat:hover{border-color:var(--link)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.qq{font-size:20px;font-weight:700;margin:6px 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.opt:hover:not([disabled]){border-color:var(--link)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.why{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--info-bg);border-left:6px solid var(--link);font-weight:500}
.feedback{min-height:30px;font-weight:700;margin-top:10px;text-align:center}
.feedback.good{color:var(--ok)}.feedback.bad{color:var(--bad)}

/* Jeu « clique sur… » */
.hsask{font-size:20px;font-weight:700;text-align:center;padding:10px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);margin-bottom:12px}
.scene{width:100%;border-radius:var(--r);overflow:hidden;border:3px solid var(--frame);background:#fff;position:relative}
.scene svg{display:block;width:100%;height:auto;cursor:pointer;user-select:none}
.scene .lbl{display:none;font-family:Lexend,Nunito,sans-serif;font-weight:700;font-size:15px;paint-order:stroke;stroke:#fff;stroke-width:4px;fill:#1B2559}
.scene .found .lbl{display:block}
.ripple{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid var(--bad);pointer-events:none;animation:rip .6s forwards}
.ripple.ok{border-color:var(--ok)}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.8);opacity:0}}

/* Souris */
.arena{position:relative;height:340px;border-radius:var(--r);background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 14px,var(--surface) 14px,var(--surface) 28px);border:3px solid var(--frame);overflow:hidden;user-select:none;touch-action:none}
.tgt{position:absolute;width:86px;height:86px;border-radius:50%;border:0;color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:left .25s,top .25s;line-height:1.1;text-align:center}
.basket{position:absolute;right:18px;bottom:18px;width:130px;height:110px;border:4px dashed var(--ok);border-radius:20px;display:grid;place-items:center;font-size:44px;background:var(--ok-bg)}
.basket.hot{background:var(--ok-line)}
.ball{position:absolute;width:70px;height:70px;border-radius:50%;background:#7A4FD8;display:grid;place-items:center;font-size:32px;cursor:grab;box-shadow:0 5px 0 #553399}
.mouseguide{display:flex;gap:16px;align-items:center;justify-content:center;margin-bottom:10px;flex-wrap:wrap;font-weight:700}
.mouseguide svg{width:54px;height:76px}

/* Clavier */

const LEVELS=[[0,"Débutant curieux"],[60,"Apprenti du clic"],[160,"Explorateur"],[300,"As du clavier"],[480,"Pro du bureau"],[700,"Expert numérique"],[950,"Champion de l’informatique"]];
function xp(){ let x=0; for(const k in S.stars) x+=S.stars[k]*10; for(const k in S.steps) x+=(S.steps[k]||[]).filter(Boolean).length*5; return x; }
function totalStars(){ return Object.values(S.stars).reduce((a,b)=>a+b,0); }
function doneCount(){ return Object.keys(S.stars).length; }
function level(){ const x=xp(); let i=0; LEVELS.forEach((l,j)=>{ if(x>=l[0]) i=j; }); const next=LEVELS[i+1]; return {i, name:LEVELS[i][1], pct: next? (x-LEVELS[i][0])/(next[0]-LEVELS[i][0])*100 : 100}; }
function modDone(m){ return m.missions.filter(x=>S.stars[x.id]).length; }

function confetti(){
  const c=document.getElementById("confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#FFB703","#FB8500","#1C9CC0","#0FA37F","#7B61FF","#E5484D"];
  const P=Array.from({length:160},()=>({x:c.width/2+(Math.random()-.5)*200,y:c.height/3,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:6+Math.random()*7,r:Math.random()*6,c:cols[Math.floor(Math.random()*6)]}));
  let f=0; (function loop(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();}); if(++f<160) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height); })();
}

/* Image d'une étape : dessin + vraie capture si elle existe */
function stepFigure(x,i){
  const v=(VIS[x.id]||[])[i]; if(!v) return "<div></div>";
  return `<figure class="shot" tabindex="0" role="button" aria-label="Agrandir l’image de l’étape ${i+1}">${IL.draw(v[0],v[1])}<img alt="Capture d’écran de l’étape ${i+1}" data-src="captures/${x.id}-${i+1}"><span class="zoom">🔍 Agrandir</span></figure>`;
}
function loadReal(img){
  const exts=["png","jpg"]; let k=0;
  img.onload=()=>img.parentNode&&img.parentNode.classList.add("has-real");
  img.onerror=()=>{ k++; if(k<exts.length) img.src=img.dataset.src+"."+exts[k]; else img.remove(); };
  img.src=img.dataset.src+"."+exts[0];
}
function openLightbox(fig,txt){
  const d=document.createElement("div"); d.className="lightbox"; d.setAttribute("role","dialog");
  const c=fig.cloneNode(true); c.removeAttribute("tabindex"); c.querySelector(".zoom")?.remove();
  d.appendChild(c); const p=document.createElement("p"); p.innerHTML=txt; d.appendChild(p);
  window.__lenis&&window.__lenis.stop();
  const close=()=>{ d.remove(); removeEventListener("keydown",esc); window.__lenis&&window.__lenis.start(); fig.focus(); };
  const esc=e=>{ if(e.key==="Escape") close(); };
  d.onclick=close; addEventListener("keydown",esc); document.body.appendChild(d);
}

      const j=+b.dataset.j;

ENGINES.mouse=(el,a,finish)=>{
  const PH=[{k:"click",n:5,label:"Clic gauche",how:"Appuie <b>une fois</b> sur le bouton <b>gauche</b>",col:"#1C9CC0",btn:"L"},
            {k:"dbl",n:3,label:"Double-clic",how:"Appuie <b>deux fois rapidement</b> sur le bouton <b>gauche</b>",col:"#0FA37F",btn:"L"},

  let p, c, err;
  const mouseIco=b=>`<svg viewBox="0 0 54 76"><rect x="3" y="3" width="48" height="70" rx="24" fill="#fff" stroke="#023047" stroke-width="3"/><path d="M27 3 v26" stroke="#023047" stroke-width="3"/><path d="M3 29 h48" stroke="#023047" stroke-width="3"/>${b==="L"?'<path d="M27 4 v24 H4 v-1 A24 24 0 0 1 27 4z" fill="#FFB703"/>':'<path d="M27 4 v24 H50 v-1 A24 24 0 0 0 27 4z" fill="#FFB703"/>'}<rect x="24" y="12" width="6" height="11" rx="3" fill="#023047"/></svg>`;
  function start(){ p=0;c=0;err=0; render(); }
  function render(){

    el.innerHTML=`<div class="actbar"><div>Épreuve ${p+1}/4 : <span style="color:${ph.col}">${ph.label}</span> — ${c}/${ph.n}</div><div class="errs">${err} erreur${err>1?"s":""}</div></div>

      <div class="arena" id="ar"></div><div class="feedback" id="fb"></div>`;
    const ar=el.querySelector("#ar"); ar.oncontextmenu=e=>e.preventDefault();
    if(ph.k==="drag") dragRound(ar); else target(ar,ph);
  }
  function fb(ok,msg){ const f=el.querySelector("#fb"); f.className="feedback "+(ok?"good":"bad"); f.textContent=msg; if(!ok) el.querySelector(".errs").textContent=`${err} erreur${err>1?"s":""}`; }
  function place(t,ar){ const w=ar.clientWidth-96, h=ar.clientHeight-96; t.style.left=(8+Math.random()*w)+"px"; t.style.top=(8+Math.random()*h)+"px"; }
  function success(){ c++; fb(true,pick(CHEERS)); if(c>=PH[p].n){ p++; c=0; if(p>=PH.length){ const s=starsFromErr(err); el.innerHTML=endBox(s,err)+`<p style="text-align:center;font-weight:800">Ta main maîtrise la souris ! 🖱️✨</p>`; bindReplay(el,start); finish(s); return true;} toast("✅","Épreuve réussie ! Passons à la suivante."); setTimeout(render,600); return true;} return false; }
  function target(ar,ph){
    const t=document.createElement("button"); t.className="tgt"; t.style.background=ph.col; t.innerHTML=ph.label.replace(" ","<br>"); ar.appendChild(t); place(t,ar);
    if(ph.k==="click"){ t.onclick=()=>{ if(!success()) place(t,ar); }; t.oncontextmenu=e=>{e.preventDefault();err++;fb(false,"C’est le bouton GAUCHE ici 😉");}; }
    if(ph.k==="dbl"){ let tm; t.onclick=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ fb(false,"Un seul clic… fais-en deux bien rapides !"); },450); }; t.ondblclick=()=>{ clearTimeout(tm); if(!success()) place(t,ar); }; t.oncontextmenu=e=>{e.preventDefault();err++;fb(false,"Bouton GAUCHE, deux fois vite 😉");}; }
    if(ph.k==="right"){ t.oncontextmenu=e=>{ e.preventDefault(); if(!success()) place(t,ar); }; t.onclick=()=>{ err++; fb(false,"Oups, c’est le bouton DROIT cette fois !"); }; }
  }
  function dragRound(ar){
    ar.innerHTML=`<div class="basket" id="bk">🧺</div>`; const bk=ar.querySelector("#bk");
    const b=document.createElement("div"); b.className="ball"; b.textContent="⚽"; ar.appendChild(b);
    const home=()=>{ b.style.left=(20+Math.random()*(ar.clientWidth*0.4))+"px"; b.style.top=(20+Math.random()*(ar.clientHeight-110))+"px"; }; home();
    let drag=false, ox=0, oy=0;
    b.addEventListener("pointerdown",e=>{ if(e.button!==0) return; drag=true; b.setPointerCapture(e.pointerId); const r=b.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top; b.style.cursor="grabbing"; });
    b.addEventListener("pointermove",e=>{ if(!drag) return; const r=ar.getBoundingClientRect(); b.style.left=(e.clientX-r.left-ox)+"px"; b.style.top=(e.clientY-r.top-oy)+"px"; const br=bk.getBoundingClientRect(); bk.classList.toggle("hot", e.clientX>br.left&&e.clientX<br.right&&e.clientY>br.top&&e.clientY<br.bottom); });
    b.addEventListener("pointerup",e=>{ if(!drag) return; drag=false; b.style.cursor="grab"; const br=bk.getBoundingClientRect(); bk.classList.remove("hot");
      if(e.clientX>br.left&&e.clientX<br.right&&e.clientY>br.top&&e.clientY<br.bottom){ if(!success()){ setTimeout(home,200);} }
      else { fb(false,"Pas encore dans le panier : garde le bouton enfoncé jusqu’au panier !"); home(); } });
  }
  start();
};

/* ---- DESK (file manager simulator) ---- */
ENGINES.desk=(el,a,finish)=>{

  const T=[
    ["Crée un <b>nouveau dossier</b> : clic droit sur le bureau (dans le vide) → Nouveau dossier", ()=>items.some(x=>x.type==="folder"&&x.parent!=="trash")],

  function start(){ items=[{id:"plage",name:"plage.jpg",type:"file",g:"🖼️",parent:"desk"},{id:"lettre",name:"lettre.docx",type:"file",g:"📄",parent:"desk"},{id:"brouillon",name:"brouillon.txt",type:"file",g:"🗒️",parent:"desk"}];

    el.innerHTML=`<div class="split"><div><ul class="tasks">${T.map(t=>`<li>${t[0]}</li>`).join("")}</ul><div class="muted" style="font-size:14px;font-weight:700">💡 Clic droit = menu. Double-clic = ouvrir. Glisser = maintenir le clic et déplacer.</div></div>

      <div class="dtask"><span style="font-size:18px">⊞</span><span>🔍 Rechercher</span><span style="flex:1"></span><span>14:30</span></div>${ctx?ctxHTML():""}</div></div></div><div id="dend"></div>`;
    bind(); check();
    const rn=el.querySelector("#rn"); if(rn){ rn.focus(); rn.select(); rn.onkeydown=e=>{ if(e.key==="Enter"){ commitRename(rn.value);} if(e.key==="Escape"){renaming=null;render();} }; rn.onblur=()=>commitRename(rn.value); rn.onmousedown=e=>e.stopPropagation(); rn.oncontextmenu=e=>e.stopPropagation(); }
  }
  function commitRename(v){ if(!renaming) return; const x=get(renaming); renaming=null; if(v.trim()) x.name=v.trim(); toast("✏️","Renommé ! "+pick(CHEERS)); render(); }
  function ctxHTML(){ const c=ctx; let b="";

ENGINES.excel=(el,a,finish)=>{
  const cols="ABCDEFGH".slice(0,a.cols).split("");
  let raw, done, cur;
  function start(){ raw=Object.assign({},a.preset); done=false; cur="A1"; render(); }
  function val(ref,depth=0){
    const r=(raw[ref]||"").trim(); if(!r) return "";
    if(r[0]!=="="){ const n=r.replace(/\s/g,"").replace(",","."); return /^-?\d+(\.\d+)?$/.test(n)?parseFloat(n):r; }
    if(depth>20) return "#REF!";
    let ex=r.slice(1).toUpperCase().replace(/\s/g,"");
    const rng=(a1,b1)=>{ const c1=a1.charCodeAt(0),c2=b1.charCodeAt(0),r1=+a1.slice(1),r2=+b1.slice(1),out=[];
      for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++) for(let rr=Math.min(r1,r2);rr<=Math.max(r1,r2);rr++){ const v=val(String.fromCharCode(c)+rr,depth+1); if(typeof v==="number") out.push(v);} return out; };
    ex=ex.replace(/(SOMME|SUM|MAX|MIN|MOYENNE|AVERAGE)\(([A-Z]\d+):([A-Z]\d+)\)/g,(_,f,x,y)=>{ const v=rng(x,y); if(!v.length) return "0";
      return String({SOMME:v.reduce((p,q)=>p+q,0),SUM:v.reduce((p,q)=>p+q,0),MAX:Math.max(...v),MIN:Math.min(...v),MOYENNE:v.reduce((p,q)=>p+q,0)/v.length,AVERAGE:v.reduce((p,q)=>p+q,0)/v.length}[f]); });
    ex=ex.replace(/[A-Z]\d+/g,m=>{ const v=val(m,depth+1); return typeof v==="number"?String(v):"0"; });
    ex=ex.replace(/,/g,".");
    if(!/^[0-9+\-*/().]+$/.test(ex)) return "#NOM?";
    try{ const v=Function('"use strict";return ('+ex+")")(); return (typeof v==="number"&&isFinite(v))?Math.round(v*1e6)/1e6:"#DIV/0!"; }catch(e){ return "#ERREUR"; }
  }
  const g=ref=>({raw:raw[ref]||"", f:(raw[ref]||"").trim().startsWith("="), val:val(ref)});
  const fmt=v=> typeof v==="number" ? v.toLocaleString("fr-FR",{maximumFractionDigits:2}) : v;
  function render(){
    el.innerHTML=`<div class="split"><div><ul class="tasks">${a.tasks.map(t=>`<li>${t[0]}</li>`).join("")}</ul><div class="muted" style="font-size:14px;font-weight:700">💡 Une formule commence toujours par <b>=</b>. Clique sur une cellule pour voir sa formule dans la barre ƒx.</div></div>
      <div class="xapp"><div class="xtitle">📊 Classeur1 – Excel (entraînement)</div>
       <div class="fbar"><div class="ref" id="xr">${cur}</div><b>ƒx</b><div class="fx" id="xf"></div></div>
       <div class="xwrap"><table class="xgrid"><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>
       ${Array.from({length:a.rows},(_,r)=>`<tr><th>${r+1}</th>${cols.map(c=>{const ref=c+(r+1);return `<td data-r="${ref}" class="${(a.head||[]).includes(ref)?"hd":""}"><input data-r="${ref}"></td>`}).join("")}</tr>`).join("")}</table></div></div></div><div id="xend"></div>`;
    el.querySelectorAll(".xgrid input").forEach(inp=>{
      const ref=inp.dataset.r; show(inp);
      inp.onfocus=()=>{ cur=ref; inp.value=raw[ref]||""; inp.classList.remove("num"); el.querySelector("#xr").textContent=ref; el.querySelector("#xf").textContent=raw[ref]||""; el.querySelectorAll(".xgrid td").forEach(td=>td.classList.toggle("sel",td.dataset.r===ref)); };
      inp.oninput=()=>{ el.querySelector("#xf").textContent=inp.value; };
      inp.onblur=()=>{ raw[ref]=inp.value; refreshAll(); check(); };
      inp.onkeydown=e=>{ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); raw[ref]=inp.value; const c=ref[0], r=+ref.slice(1);
        const nx= e.key==="Enter" ? c+Math.min(r+1,a.rows) : (cols[cols.indexOf(c)+1]||c)+r; const t=el.querySelector(`.xgrid input[data-r="${nx}"]`); (t&&nx!==ref)?t.focus():inp.blur(); } };
    });
    check();
  }
  function show(inp){ const v=val(inp.dataset.r); inp.value=fmt(v); inp.classList.toggle("num",typeof v==="number"); }
  function refreshAll(){ el.querySelectorAll(".xgrid input").forEach(inp=>{ if(document.activeElement!==inp) show(inp); }); }
  function check(){ if(done) return; const ok=a.tasks.map(t=>{try{return !!t[1](g);}catch(e){return false;}});
    el.querySelectorAll(".tasks li").forEach((li,j)=>{ if(ok[j]&&!li.classList.contains("ok")) toast("✅",pick(CHEERS)); li.classList.toggle("ok",ok[j]); });
    if(ok.every(Boolean)){ done=true; el.querySelector("#xend").innerHTML=endBox(3,0)+`<p style="text-align:center;font-weight:800">Excel n’a plus de secret pour toi ! 📊🧠</p>`; bindReplay(el,start); finish(3);} }
  start();
};

/* =========================================================
   VOIX DE RENÉ (synthèse vocale du navigateur, en français)
   ========================================================= */
const VOICE={on:true,unlocked:false,pending:"",voice:null};
const canSpeak=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
if(!canSpeak) document.documentElement.classList.add("no-voice");
try{ if(localStorage.getItem("da-voice")==="off") VOICE.on=false; }catch(e){}
function pickVoice(){ const vs=speechSynthesis.getVoices(); VOICE.voice=vs.find(v=>/^fr[-_]FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null; }
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speakable(html){
  const d=document.createElement("div"); d.innerHTML=html; d.querySelectorAll("pre").forEach(p=>p.replaceWith(" Le code est affiché à l’écran. "));
  return d.textContent.replace(/⊞ ?Win/g,"touche Windows").replace(/\s\+\s/g," plus ").replace(/→/g,", puis ").replace(/Ctrl/g,"Contrôle").replace(/⇧ ?Maj/g,"Majuscule").replace(/↵/g,"").replace(/\(\*\.\*\)/g,"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}\u{FE0F}]/gu,"").replace(/\s+/g," ").trim();
}
function say(html,force){
  if(!canSpeak) return; if(!VOICE.on&&!force) return;
  if(!VOICE.unlocked){ VOICE.pending=html; return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(speakable(html)); u.lang="fr-FR"; if(VOICE.voice) u.voice=VOICE.voice; u.rate=.95; u.pitch=1;
  u.onstart=()=>document.body.classList.add("speaking"); u.onend=u.onerror=()=>document.body.classList.remove("speaking");
  speechSynthesis.speak(u);
}
function unlockVoice(){ if(VOICE.unlocked) return; VOICE.unlocked=true; const p=VOICE.pending; VOICE.pending=""; if(p) setTimeout(()=>{ if(!speechSynthesis.speaking) say(p); },150); }
addEventListener("pointerdown",unlockVoice,{capture:true}); addEventListener("keydown",unlockVoice,{capture:true});
let currentIntro="";

  else if(h==="formations") t=`Voici les ${MODULES.length} parcours. Choisis-en un, ou continue là où tu t’étais arrêté.`;
  else if(h==="exercices") t="Voici tous les défis. Rejoue-les pour gagner les trois étoiles.";
  else if(h==="ressources") t="Ici, tu trouves les mots techniques expliqués simplement, et les raccourcis clavier.";

  else { const nx=nextMission(); t=S.name?`Re-bonjour ${S.name} ! C’est René. `+(nx?`On continue avec la mission : ${nx.title}.`:"Tu as tout terminé. Bravo !"):"Bonjour, moi c’est René ! Je suis ton guide sur Digital Academy. Ici, tu apprends l’ordinateur pas à pas, gratuitement. Écris ton prénom, puis clique sur Commencer à apprendre."; }
  currentIntro=t; say(t);
}

  function blurText(el){
    if(el.dataset.split) return; el.dataset.split="1";
    const words=el.textContent.trim().split(/\s+/);
    el.innerHTML=words.map(w=>`<span class="bw">${esc(w)}</span>`).join(" ");
    gsap.from(el.querySelectorAll(".bw"),{filter:"blur(10px)",opacity:0,y:-14,duration:.7,ease:"power3.out",stagger:.09,clearProps:"filter,transform,opacity"});
  }
  return {view(){ if(reduce||!window.gsap) return; app.querySelectorAll(".blur-in").forEach(blurText); }};
